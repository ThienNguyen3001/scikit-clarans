[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "Cython>=3.0",
    "numpy",
]
build-backend = "setuptools.build_meta"

[tool.mypy]
ignore_missing_imports = true
warn_unused_configs = true
follow_imports = "silent"

[tool.cibuildwheel]
# Build on CPython 3.9 through 3.13
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
# Skip PyPy and 32-bit architectures
skip = "pp* *-win32 *-manylinux_i686 *-musllinux_i686"

# Test built wheels to verify native C extensions import and pass tests
test-requires = ["pytest", "pandas"]
test-command = "pytest {project}/clarans/tests"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
