version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - ninja-build
  jobs:
    post_install:
      - pip install git+https://github.com/scikit-learn-contrib/scikit-learn-extra.git

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
