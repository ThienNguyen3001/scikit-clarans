name: ASV Benchmarks

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'clarans/**'
      - 'asv_bench/**'
      - 'asv.conf.json'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run ASV Benchmark Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asv virtualenv meson-python ninja "cython>=3.0" "numpy>=2.0.0"
          pip install --no-build-isolation -e ".[dev]"

      - name: Configure ASV machine
        run: |
          python -c "
          import json, os
          p = os.path.expanduser('~/.asv-machine.json')
          data = {
              'github-actions': {
                  'arch': 'x86_64',
                  'cpu': 'GitHub Actions Hosted CPU',
                  'machine': 'github-actions',
                  'num_cpu': '2',
                  'os': 'Linux',
                  'ram': '16GB'
              },
              'version': 1
          }
          json.dump(data, open(p, 'w'))
          "

      - name: Restore ASV raw results cache
        uses: actions/cache@v4
        with:
          path: .asv/results
          key: asv-results-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            asv-results-${{ runner.os }}-
            asv-results-

      - name: Consolidate and normalize ASV results across runs
        run: |
          python -c "
          import os, json, shutil

          results_dir = '.asv/results'
          target_machine = 'github-actions'
          target_dir = os.path.join(results_dir, target_machine)
          os.makedirs(target_dir, exist_ok=True)

          # Merge historical results from old/ephemeral runner hostnames into github-actions
          if os.path.exists(results_dir):
              for entry in os.listdir(results_dir):
                  entry_path = os.path.join(results_dir, entry)
                  if os.path.isdir(entry_path) and entry != target_machine and not entry.startswith('.'):
                      print('Consolidating historical results from ' + entry + ' into ' + target_machine + '...')
                      for fname in os.listdir(entry_path):
                          src = os.path.join(entry_path, fname)
                          dst = os.path.join(target_dir, fname)
                          if fname == 'machine.json':
                              if not os.path.exists(dst):
                                  shutil.copy2(src, dst)
                          else:
                              if not os.path.exists(dst):
                                  shutil.move(src, dst)
                              else:
                                  try:
                                      os.remove(src)
                                  except OSError:
                                      pass
                      shutil.rmtree(entry_path, ignore_errors=True)

          # Normalize metadata across all JSON result files
          if os.path.exists(target_dir):
              for fname in os.listdir(target_dir):
                  if fname.endswith('.json'):
                      p = os.path.join(target_dir, fname)
                      try:
                          with open(p, 'r', encoding='utf-8') as fp:
                              data = json.load(fp)
                          modified = False
                          if fname == 'machine.json':
                              data['machine'] = target_machine
                              data['cpu'] = 'GitHub Actions Hosted CPU'
                              data['ram'] = '16GB'
                              modified = True
                          elif isinstance(data, dict) and 'params' in data and isinstance(data['params'], dict):
                              data['params']['machine'] = target_machine
                              data['params']['cpu'] = 'GitHub Actions Hosted CPU'
                              data['params']['ram'] = '16GB'
                              modified = True
                          if modified:
                              with open(p, 'w', encoding='utf-8') as fp:
                                  json.dump(data, fp)
                      except Exception as e:
                          print('Warning: failed updating ' + fname + ': ' + str(e))
          "

      - name: Run ASV Benchmarks
        run: |
          git fetch --tags --force
          python -c "
          import subprocess
          from packaging.version import parse as parse_version

          raw_tags = subprocess.check_output(['git', 'tag', '-l']).decode().split()
          tags = [t for t in raw_tags if parse_version(t.lstrip('v')) >= parse_version('0.3.0')]
          tags.sort(key=lambda t: parse_version(t.lstrip('v')))

          targets = []
          for tag in tags:
              try:
                  ref = 'refs/tags/' + tag + '^{commit}'
                  commit = subprocess.check_output(['git', 'rev-parse', ref]).decode().strip()
                  targets.append(('tag ' + tag, commit))
              except Exception as e:
                  print('Warning: failed resolving tag ' + tag + ': ' + str(e))

          head_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          if not any(c == head_commit for _, c in targets):
              targets.append(('HEAD', head_commit))

          for label, commit in targets:
              print('==================================================')
              print('Benchmarking ' + label + ' (' + commit + ')...')
              print('==================================================')
              cmd = [
                  'asv', 'run', '-E', 'existing',
                  '--machine', 'github-actions',
                  '--skip-existing-commits',
                  '--set-commit-hash', commit,
                  '--show-stderr'
              ]
              res = subprocess.run(cmd)
              if res.returncode != 0:
                  print('ASV run for ' + label + ' exited with returncode ' + str(res.returncode))
          "

      - name: Normalize ASV hardware profiles across runs
        run: |
          python -c "
          import os, json
          target_dir = os.path.join('.asv/results', 'github-actions')
          if os.path.exists(target_dir):
              for f in os.listdir(target_dir):
                  if f.endswith('.json'):
                      p = os.path.join(target_dir, f)
                      try:
                          with open(p, 'r', encoding='utf-8') as fp:
                              data = json.load(fp)
                          modified = False
                          if f == 'machine.json':
                              data['machine'] = 'github-actions'
                              data['cpu'] = 'GitHub Actions Hosted CPU'
                              data['ram'] = '16GB'
                              modified = True
                          elif isinstance(data, dict) and 'params' in data and isinstance(data['params'], dict):
                              data['params']['machine'] = 'github-actions'
                              data['params']['cpu'] = 'GitHub Actions Hosted CPU'
                              data['params']['ram'] = '16GB'
                              modified = True
                          if modified:
                              with open(p, 'w', encoding='utf-8') as fp:
                                  json.dump(data, fp)
                      except Exception:
                          pass
          "

      - name: Build ASV HTML Dashboard
        run: |
          asv publish

      - name: Deploy ASV HTML to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .asv/html
          keep_files: false

