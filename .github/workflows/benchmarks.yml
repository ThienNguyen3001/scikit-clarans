name: ASV Benchmarks

on:
  push:
    branches:
      - main
    paths:
      - 'clarans/**'
      - 'asv_bench/**'
      - 'asv.conf.json'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run ASV Benchmark Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asv virtualenv meson-python ninja "cython>=3.0" "numpy>=2.0.0"
          pip install --no-build-isolation -e ".[dev]"

      - name: Configure ASV machine
        run: |
          asv machine --yes
          python -c "import json, os; p = os.path.expanduser('~/.asv-machine.json'); d = json.load(open(p)); [v.update({'cpu': 'GitHub Actions Hosted CPU', 'ram': '16GB'}) for v in d.values() if isinstance(v, dict)]; json.dump(d, open(p, 'w'))"

      - name: Restore ASV raw results cache
        uses: actions/cache@v4
        with:
          path: .asv/results
          key: asv-results-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            asv-results-${{ runner.os }}-
            asv-results-

      - name: Run ASV Benchmarks
        run: |
          for commit in $(git rev-list --reverse -n 3 HEAD); do
            echo "Benchmarking commit $commit..."
            asv run -E existing --skip-existing-commits --set-commit-hash "$commit" --show-stderr || true
          done

      - name: Normalize ASV hardware profiles across runs
        run: |
          python -c "
          import os, json
          results_dir = '.asv/results'
          for root, dirs, files in os.walk(results_dir):
              for f in files:
                  if f.endswith('.json'):
                      p = os.path.join(root, f)
                      try:
                          with open(p, 'r', encoding='utf-8') as fp:
                              data = json.load(fp)
                          modified = False
                          if f == 'machine.json':
                              data['cpu'] = 'GitHub Actions Hosted CPU'
                              data['ram'] = '16GB'
                              modified = True
                          elif isinstance(data, dict) and 'params' in data and isinstance(data['params'], dict):
                              data['params']['cpu'] = 'GitHub Actions Hosted CPU'
                              data['params']['ram'] = '16GB'
                              modified = True
                          if modified:
                              with open(p, 'w', encoding='utf-8') as fp:
                                  json.dump(data, fp)
                      except Exception:
                          pass
          "

      - name: Build ASV HTML Dashboard
        run: |
          asv publish

      - name: Deploy ASV HTML to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .asv/html
          keep_files: false

